<style>

<body>
<div class="shell">

  <main id="app" aria-live="polite"></main>
  <details class="footnote"><summary>原典與遊戲改編說明</summary>
    <p>《無底之胃》取材自卡利馬科斯《致狄蜜特頌歌》與奧維德《變形記》第八卷。女神變作祭司勸阻砍樹的情節取自卡利馬科斯；聖樹精靈、飢餓化身與女兒梅斯特拉的重要情節取自奧維德。</p>
    <p>這個試玩版將兩個古典版本的素材明確融合成同一段「神話改編故事」，不是任何一部原典的逐字重現。梅斯特拉的童年回憶、白色祈願帶、達蒙管家、探索物件和六天數值規則是原創情節。</p>
    <p><a href="https://www.theoi.com/Text/CallimachusHymns2.html" target="_blank" rel="noopener noreferrer">卡利馬科斯英譯</a> · <a href="https://www.theoi.com/Text/OvidMetamorphoses8.html" target="_blank" rel="noopener noreferrer">奧維德英譯</a></p>
  </details>
  <footer class="footer">單一 HTML 檔 · 不需登入、不依賴網路圖片 · 試玩版不會取代現有 1.0</footer>

<script>
'use strict';
const root=document.getElementById('app');
const s={stage:'home',found:[],clue:null,step:0,choice:null,stats:{hunger:25,money:65,family:72},day1:null};
const cap=(n)=>Math.max(0,Math.min(100,n));
function art(type){

  <path d="M410 150q20 24 11 37" fill="none" stroke="#f4e6c7" stroke-width="5"/><path d="M410 150q-16 8 -25 0" fill="none" stroke="#efe2c3" stroke-width="4"/>

  <g fill="#d8b97b" opacity=".65">${Array.from({length:20},(_,i)=>`<circle cx="${30+(i*71)%645}" cy="${275+(i*19)%55}" r="${i%3===0?2.6:1.4}"/>`).join('')}</g>
  <path d="M0 330Q135 316 256 332T503 331T700 326V355H0Z" fill="#152b27" opacity=".65"/>`;

  ${[62,154,519,611].map(x=>`<rect x="${x}" y="28" width="28" height="262" fill="#b09c7c"/><rect x="${x-9}" y="27" width="46" height="17" fill="#d6bd93"/><rect x="${x-9}" y="275" width="46" height="15" fill="#bca47d"/>`).join('')}

  ${[186,284,407,510].map((x,i)=>`<ellipse cx="${x}" cy="248" rx="${30+i%2*7}" ry="10" fill="#e0cf9d"/><ellipse cx="${x}" cy="247" rx="${22+i%2*6}" ry="6" fill="#746e52"/>`).join('')}

const explore={
plaque:{emoji:'🏺',name:'還願木牌',description:'一位母親留下這塊小木牌，感謝女神讓病後的孩子重新走進田野。這片森林，承載著人們對豐收與平安的盼望。',tag:'信仰與感激'},
ribbon:{emoji:'🎗️',name:'白色祈願帶',description:'枝條上繫著一條泛白的布帶。梅斯特拉認得它——那是她幼時生病後，家人帶她來向女神獻上的祈願。',tag:'梅斯特拉的回憶'},
tree:{emoji:'🌳',name:'古老的橡樹',description:'把手貼在樹皮上，彷彿聽見極細微的呼吸。這棵樹不只是木材；在古老傳說中，神聖的樹木也可能是精靈的居所。',tag:'生命的界線'}
};
const memory=[
{speaker:'旁白',line:'午後的陽光從樹葉間落下。你與女兒梅斯特拉走進聖林，迎面而來的是潮濕泥土與穀穗的氣味。'},
{speaker:'梅斯特拉',line:'「父親，您還記得這裡嗎？我小時候生過一場病，家人帶我到這裡祈願。」'},
{speaker:'厄律西克同',line:'「不過是一棵樹，竟然值得妳記到現在？」'},
{speaker:'梅斯特拉',line:'「我記得的不是樹而已。是那時候，有人希望我好起來。」'},
{speaker:'旁白',line:'達蒙帶著僕人來到樹下。他奉命尋找建造宴飲場所所需的木材。眾人望向眼前這棵最古老的橡樹。'},
{speaker:'達蒙',line:'「主人……這棵樹受到女神庇護。若把它砍倒，恐怕會有後果。」'}
];
const collapse=[
{speaker:'旁白',line:'你奪過斧頭。第一下落在樹幹，森林裡的鳥鳴突然停止。'},
{speaker:'旁白',line:'深色的汁液沿著傷口滲出。樹葉瞬間失去光澤，巨大的枝條顫抖，如同有人在疼痛中呻吟。'},
{speaker:'樹木精靈',line:'「我在此守護過無數個春天……你將明白，奪取，並不等於擁有。」'},
{speaker:'梅斯特拉',line:'「父親……停下來，好不好？」'},
{speaker:'旁白',line:'橡樹轟然倒下。梅斯特拉沒有再說話，只彎下腰，拾起那條沾了泥土的白色祈願帶。'}
];
const dreams=[
{speaker:'旁白',line:'那一夜，狄蜜特命令飢餓的化身前往你的房間。你夢見一桌永遠無法碰到的盛宴。'},
{speaker:'飢餓化身',line:'「你奪走了她的森林。」'},
{speaker:'飢餓化身',line:'「現在，讓我奪走你的滿足。」'},
{speaker:'旁白',line:'每當你伸手抓住麵包，食物便在指尖化為灰燼。黎明時，你帶著從未體驗過的飢餓醒來。'}
];
const breakfast=[
{speaker:'旁白',line:'第一日清晨。達蒙端來早餐，你很快就吃完了，腹中卻仍像有火在燃燒。'},
{speaker:'厄律西克同',line:'「再拿一份來。我根本沒有吃飽！」'},
{speaker:'達蒙',line:'「主人，您已經吃下六人份的早餐了。」'},
{speaker:'厄律西克同',line:'「那又如何？我付得起！」'},
{speaker:'旁白',line:'門邊的梅斯特拉看著桌上的空盤，想起昨日那棵倒下的橡樹。'},
{speaker:'梅斯特拉',line:'「父親……您真的沒事嗎？」'},
{speaker:'旁白',line:'你知道這份飢餓不正常，但家中的糧食與金錢依然充足。你打算如何度過第一天？'}
];
const dayActions={
feast:{name:'舉辦盛宴，盡情進食',effect:'飢餓 −27 ｜ 財富 −14 ｜ 家人 −4',delta:{hunger:-27,money:-14,family:-4},story:'達蒙只好再次吩咐廚房。盤子不斷端上桌，又不斷被清空。梅斯特拉站在門口，第一次露出害怕的神情。',echo:'飢餓短暫平息，但你仍記得每一道被端走的空盤。'},
share:{name:'把部分糧食分給家僕',effect:'飢餓 +9 ｜ 財富不變 ｜ 家人 +10',delta:{hunger:9,money:0,family:10},story:'僕人驚訝地接過食物。梅斯特拉小心地問你是否身體不適；你無法回答，卻第一次察覺這場詛咒已開始牽動整個家。',echo:'你把一些食物留給了別人，自己的胃卻更加灼痛。'},
priest:{name:'向女神的祭司詢問詛咒',effect:'飢餓 +5 ｜ 財富 −4 ｜ 家人 +6',delta:{hunger:5,money:-4,family:6},story:'祭司聽完你的敘述，望向遠處聖林的方向：「這不像普通疾病。你或許應該想想，自己究竟從那裡拿走了什麼。」她沒有許諾任何解藥。',echo:'你沒有找到解答，卻開始明白飢餓可能是那棵聖樹留下的後果。'}
};
const storyStage={memory:{lines:memory,art:'forest',title:'午後的談話',eyebrow:'序章 · 父親與女兒',next:'warning'},cutscene:{lines:collapse,art:'forestcut',title:'聖樹倒下的那一刻',eyebrow:'序章 · 無法挽回',next:'dream'},dream:{lines:dreams,art:'dream',title:'飢餓的低語',eyebrow:'第一幕 · 詛咒降臨',next:'breakfast'},breakfast:{lines:breakfast,art:'banquet',title:'永遠吃不飽的早餐',eyebrow:'DAY 01 · 詛咒初現',next:'choose'}};
function btn(label,action,style=''){return `<button class="btn ${style}" type="button" data-action="${action}">${label}</button>`}
function stats(){return `<div class="states" aria-label="角色資源狀態">${[['hunger','飢餓','#d18f81'],['money','財富','#dfc088'],['family','家人','#93c2a1']].map(([key,label,color])=>`<div class="state"><div class="head"><span>${label}</span><b>${s.stats[key]}</b></div><div class="bar"><div style="width:${s.stats[key]}%;background:${color}"></div></div></div>`).join('')}</div>`}
function render(){
let html='';
const stage=s.stage;
if(stage==='home')html=`<section class="scene"><div class="eyebrow">希臘神話 × 分歧敘事 × 神聖的代價</div><h1>無底之胃</h1><p class="subtitle">THE ENDLESS HUNGER · 2.0 STORY DEMO</p>${art('forest')}<p class="story" style="text-align:center">你曾擁有豐饒的大地，卻即將失去最簡單的幸福：<strong>飽足。</strong><br>在故事開始之前，你真的知道自己準備奪走什麼嗎？</p><div class="card amber"><h3>這次能玩到哪裡？</h3><p>探索女神的聖林、認識梅斯特拉、面對砍樹抉擇，並經歷受詛咒後的第一天。每一個選擇都會有不同反應與數值結果。</p><p class="fine">這是獨立試玩版，尚未加入第二至第六天，不會修改你目前已上線的 1.0 遊戲。</p></div><div class="buttons">${btn('走入女神的聖林','start')}${btn('查看原典與遊戲說明','show-source','ghost')}</div></section>`;
if(stage==='explore'){
const clue=s.clue?explore[s.clue]:null;
html=`<section class="scene"><div class="eyebrow">序章 · 聖林最後的午後</div><h2>那些尚未被砍倒的事物</h2>${art('forest')}<div class="story"><p>花環垂在古老橡樹的枝頭。人們曾向女神祈求豐收，也曾為獲得的祝福留下謝意。</p><p>在你命人動斧之前，可以先看看這片森林裡留下了什麼。</p></div><div class="mini-label">點選探索 · 已發現 ${s.found.length} / 3</div><div class="explore-items">${Object.entries(explore).map(([k,x])=>`<button class="discover" aria-pressed="${s.clue===k}" data-action="clue:${k}" type="button"><span class="symbol">${x.emoji}</span><span class="item-name">${x.name}</span><span class="status">${s.found.includes(k)?'✓ 已發現':'輕觸查看'}</span></button>`).join('')}</div><div class="clue" aria-live="polite">${clue?`<strong>${clue.tag}</strong><p>${clue.description}</p>`:`<strong>探索提示</strong><p>這些物件沒有標準答案，你可以自由調查，也可以直接推進故事。</p>`}</div><div class="buttons">${btn('繼續：與梅斯特拉交談','go-memory')}${btn('回到封面','reset','ghost')}</div></section>`;
}
if(storyStage[stage]){
 const z=storyStage[stage],line=z.lines[s.step];
 html=`<section class="scene"><div class="eyebrow">${z.eyebrow}</div><h2>${z.title}</h2>${art(z.art)}${stage==='breakfast'?stats():''}<div class="dialogue" aria-label="劇情對話"><div class="speaker">${line.speaker}</div><p>${line.line}</p></div><p class="num">對話 ${s.step+1} / ${z.lines.length}</p><div class="buttons">${btn(s.step===z.lines.length-1?'繼續故事':'下一句  ›','advance')}${btn('略過這段對話','skip','ghost')}</div></section>`;
}
if(stage==='warning')html=`<section class="scene"><div class="eyebrow">序章 · 最後的警告</div><h2>那棵樹是誰的？</h2>${art('forest')}<div class="dialogue"><div class="speaker">女祭司</div><p>「年輕人，收起斧頭吧。大地賜予你穀物與豐收，難道你認為一切都能任意奪走？」</p></div><div class="story"><p>梅斯特拉握緊那條白色祈願帶。達蒙與僕人都在等你下令。</p><p>你可以在故事開始之前就停下，也可以讓神話的悲劇繼續發生。</p></div><div class="buttons">${btn('放下斧頭，保留聖林','spare','secondary')}${btn('無視警告，砍倒聖樹','cut')}</div><p class="fine">前者是原創架空結局；後者進入取材自古典文本的詛咒主線。</p></section>`;
if(stage==='spared')html=`<section class="scene"><div class="eyebrow">架空結局 · 未曾降臨的詛咒</div><h2>留下的一棵樹</h2>${art('forest')}<div class="dialogue"><div class="speaker">梅斯特拉</div><p>「父親，您真的願意留下這棵樹嗎？」</p></div><div class="story"><p>你放下斧頭。枝葉在風中輕輕搖晃，梅斯特拉抬頭，看見白色的祈願帶仍在樹上。</p><p>有些災難，可以在最初的選擇中避免。</p></div><div class="card amber"><p class="mini-label">這條結局是遊戲原創</p><p>在古典故事裡，厄律西克同並沒有因此停手。這條路線讓玩家比較「破壞發生之前」的另一種可能。</p></div><div class="buttons">${btn('重新開始，探索另一種命運','reset')}${btn('從聖林重新探索','restart-grove','secondary')}</div></section>`;
if(stage==='choose')html=`<section class="scene"><div class="eyebrow">DAY 01 · 第一個抉擇</div><h2>你究竟需要多少？</h2>${art('banquet')}${stats()}<div class="story"><p>餐桌上堆起了空盤。你仍然飢餓，而窗外的梅斯特拉正等著你的決定。</p><p>今天只能做一件事。不同選擇不但改變數值，也會改變家人如何看待你。</p></div><div class="mini-label">當日行動（選一次即進行結算）</div>${Object.entries(dayActions).map(([k,x])=>`<button class="day-option" type="button" data-action="choose:${k}"><strong>${x.name}</strong><span class="effect">${x.effect}</span></button>`).join('')}<p class="fine">選擇後，夜間詛咒還會使飢餓增加 +16。所有數值會限制在 0–100。</p></section>`;
if(stage==='result'){
 const x=dayActions[s.day1],delta=x.delta;
 html=`<section class="scene"><div class="eyebrow">DAY 01 · 命運留下的痕跡</div><h2>第一天，夜色降臨</h2>${art('dream')}${stats()}<div class="card"><div class="mini-label">你選擇了：${x.name}</div><p class="story">${x.story}</p></div><div class="result-note"><strong>當日結算</strong><p>飢餓 ${delta.hunger>=0?'+':''}${delta.hunger}，夜間詛咒 +16</p><p>財富 ${delta.money>=0?'+':''}${delta.money} ｜ 家人 ${delta.family>=0?'+':''}${delta.family}</p></div><div class="dialogue"><div class="speaker">夜晚的低語</div><p>「${x.echo}」

「明天，你還有多少東西可以用來交換？」</p></div><div class="buttons">${btn('看一眼第二天的伏筆','tease')}${btn('重新試試第一天的其他選擇','retry-day','secondary')}</div></section>`;
}
if(stage==='tease')html=`<section class="scene"><div class="eyebrow">試玩版終點 · DAY 02 預告</div><h2>庫房裡的聲音</h2>${art('banquet')}<div class="story"><p>隔日清晨，老管家達蒙拿著一塊記帳木板走進餐廳。</p><p>「主人，這是原本打算留到冬天的糧食。」</p><p>梅斯特拉站在門外，手裡握著那條從聖林拾回的白色布帶。</p><p>而你的胃，再一次傳來灼燒般的飢餓。</p></div><div class="card amber"><h3>序章與第一日試玩完成</h3><p>這只是 2.0 的第一段原型。完整版本將延伸到第六天，包含梅斯特拉的命運、回到聖林的夢、更多分支以及多重結局。</p><p class="fine">此頁沒有假裝後續關卡已完成；你可以回頭測試不同選擇，幫助我們確認故事節奏。</p></div><div class="buttons">${btn('從頭重玩','reset')}${btn('再試第一天不同選擇','retry-day','secondary')}</div></section>`;
root.innerHTML=html;
const pct={home:0,explore:12,memory:25,warning:35,spared:100,cutscene:47,dream:62,breakfast:73,choose:83,result:94,tease:100}[stage]??0;
document.getElementById('progress').style.width=pct+'%';
window.scrollTo(0,0);
}
function setStage(stage){s.stage=stage;s.step=0;render()}
root.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action;
 if(a==='show-source'){const d=document.querySelector('details');d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(a==='start'||a==='restart-grove'){s.found=[];s.clue=null;setStage('explore');return;}
 if(a.startsWith('clue:')){const key=a.split(':')[1];s.clue=key;if(!s.found.includes(key))s.found.push(key);render();return;}
 if(a==='go-memory'){setStage('memory');return;}
 if(a==='advance'||a==='skip'){const z=storyStage[s.stage];if(!z)return;if(a==='skip'||s.step>=z.lines.length-1){setStage(z.next)}else{s.step++;render()}return;}
 if(a==='cut'){setStage('cutscene');return;}
 if(a==='spare'){setStage('spared');return;}
 if(a.startsWith('choose:')){const key=a.split(':')[1],c=dayActions[key];if(!c||s.day1)return;s.day1=key;for(const [k,v]of Object.entries(c.delta))s.stats[k]=cap(s.stats[k]+v+(k==='hunger'?16:0));setStage('result');return;}
 if(a==='retry-day'){s.stats={hunger:25,money:65,family:72};s.day1=null;setStage('choose');return;}
 if(a==='tease'){setStage('tease');return;}
 if(a==='reset'){s.found=[];s.clue=null;s.day1=null;s.stats={hunger:25,money:65,family:72};setStage('home');return;}
});
render();
</script>
</body>
</html>
